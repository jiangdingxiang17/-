{% extends "base.html" %}

{% block title %}在线生鲜商城 - 用户登录{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="text-success mb-4">用户登录</h2>
                <p class="text-muted small mb-4">
                    登录后可以使用个人购物车，并为后续支付演示和订单生成做准备。
                </p>

                <form action="{{ url_for('login') }}" method="post">
                    <input type="hidden" name="next" value="{{ next }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="请输入用户名" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">登录</button>
                </form>

                <div class="alert alert-light border mt-4 mb-0 small">
                    <div class="fw-bold mb-1">演示账号</div>
                    <div>普通用户：user1 / 123456</div>
                    <div>管理员：admin / admin123</div>
                </div>

                <div class="text-center mt-3">
                    <span class="text-muted small">还没有账号？</span>
                    <a href="{{ url_for('register') }}" class="small text-success">去注册</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
