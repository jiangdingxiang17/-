{% extends "base.html" %}

{% block title %}在线生鲜商城 - 用户注册{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="text-success mb-4">用户注册</h2>
                <p class="text-muted small mb-4">
                    注册普通消费者账号后，购物车内容会与当前账号绑定。
                </p>

                <form action="{{ url_for('register') }}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="至少 3 个字符" minlength="3" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="至少 6 个字符" minlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">确认密码</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                               placeholder="请再次输入密码" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">注册</button>
                </form>

                <div class="text-center mt-3">
                    <span class="text-muted small">已有账号？</span>
                    <a href="{{ url_for('login') }}" class="small text-success">去登录</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
