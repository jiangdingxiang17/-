{% extends "base.html" %}

{% block title %}在线生鲜商城 - {{ '新增商品' if mode == 'new' else '编辑商品' }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-success mb-0">
        <span class="me-2">{{ '➕' if mode == 'new' else '✏️' }}</span>
        {{ '新增商品' if mode == 'new' else '编辑商品' }}
    </h2>
    <a href="{{ url_for('admin_products') }}" class="btn btn-outline-success">
        <span class="me-1">←</span>返回商品管理
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form action="{{ url_for('admin_product_new') if mode == 'new' else url_for('admin_product_edit', product_id=product.id) }}" 
              method="POST">
            <div class="row g-4">
                <div class="col-md-6">
                    <label for="name" class="form-label fw-bold">商品名称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" 
                           value="{{ product.name if product else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label for="category" class="form-label fw-bold">分类 <span class="text-danger">*</span></label>
                    <select class="form-select" id="category" name="category" required>
                        <option value="" disabled {% if not product %}selected{% endif %}>请选择分类</option>
                        <option value="蔬菜" {% if product and product.category == '蔬菜' %}selected{% endif %}>蔬菜</option>
                        <option value="水果" {% if product and product.category == '水果' %}selected{% endif %}>水果</option>
                        <option value="肉类" {% if product and product.category == '肉类' %}selected{% endif %}>肉类</option>
                        <option value="鱼类" {% if product and product.category == '鱼类' %}selected{% endif %}>鱼类</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="price" class="form-label fw-bold">价格 <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="price" name="price" step="0.01" min="0"
                           value="{{ product.price if product else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label for="stock" class="form-label fw-bold">库存 <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="stock" name="stock" min="0"
                           value="{{ product.stock if product else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label for="min_stock" class="form-label fw-bold">低库存预警线</label>
                    <input type="number" class="form-control" id="min_stock" name="min_stock" min="0"
                           value="{{ product.min_stock if product else 10 }}">
                </div>
                <div class="col-md-12">
                    <label for="image_url" class="form-label fw-bold">商品图片URL</label>
                    <input type="text" class="form-control" id="image_url" name="image_url"
                           value="{{ product.image_url if product else '' }}" placeholder="https://...">
                </div>
                <div class="col-md-12">
                    <label for="description" class="form-label fw-bold">商品描述</label>
                    <textarea class="form-control" id="description" name="description" rows="3"
                              placeholder="请输入商品描述">{{ product.description if product else '' }}</textarea>
                </div>
            </div>
            <div class="mt-4 d-flex gap-3">
                <button type="submit" class="btn btn-success">
                    {{ '保存' if mode == 'new' else '更新' }}
                </button>
                <a href="{{ url_for('admin_products') }}" class="btn btn-outline-secondary">
                    返回
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
